<script>
(() => {
  const frames = JSON.parse(document.getElementById('frames').textContent);
  const body = document.getElementById('body');
  const detail = document.getElementById('detail');
  const eye = document.getElementById('eye');
  const pupil = document.getElementById('pupil');
  let elapsed = 0, last = 0, current = -1;
  function tick(now) {
    if (last && !document.hidden) elapsed += Math.min((now - last) / 1000, 0.05);
    last = now;
    const index = Math.floor(elapsed * 48) % frames.length;
    const frame = frames[index];
    if (index !== current) {
      current = index;
      body.setAttribute('d', frame.body);
      detail.setAttribute('d', frame.detail);
    }
    const ex = +frame.eye.cx, ey = +frame.eye.cy;
    eye.setAttribute('cx', ex);
    eye.setAttribute('cy', ey);
    eye.setAttribute('transform', `rotate(-79.3 ${ex} ${ey})`);
    const px = ex - 13 + Math.sin(elapsed * 1.8) * 8;
    const py = ey - 6 + Math.sin(elapsed * 1.15) * 3;
    pupil.setAttribute('cx', px.toFixed(2));
    pupil.setAttribute('cy', py.toFixed(2));
    pupil.setAttribute('transform', `rotate(-80.74 ${px.toFixed(2)} ${py.toFixed(2)})`);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
