    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #FCFBF4;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #loading-overlay video {
            max-width: 60vw;
            max-height: 60vh;
            border-radius: 1rem;
        }

        .header-full .logo {
            color: #000000;
        }

        .header-full .nav-link {
            color: #000000;

        }

        .nav-link.nav-button {
            background-color: #000;
            color: #fff;
            padding: 6px 18px;
            /* 调整内边距形成胶囊形状 */
            border-radius: 999px;
            /* 圆角形成胶囊 */
            border: 1px solid #000;
            transition: background-color 0.3s ease, color 0.3s ease;
        }





        /* 主容器 */
        .stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .block {
            width: 100%;
            position: relative;
        }

        /* 全屏封面 & 大图 */
        .block.cover {
            overflow: hidden;
        }

        .block.cover img,
        .block.cover video,
        .block img,
        .block video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .block.cover {
            position: relative;
            overflow: hidden;
        }

        .block.cover video {
            position: absolute;
            /* 固定在容器底层 */
            top: 10%;
            left: 0;
            z-index: 1;
            /* 视频在底层 */
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .block.cover img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            /* height: 100vh; */

            object-fit: cover;
            /* 保持比例裁切 */
            /* object-position: center top; */
            /* 从下半部分对齐裁剪 */
            display: block;
        }


        /* 中等视频段 */
        .block.video-focus {
            display: flex;
            justify-content: center;
            padding: 4vh 0;
            background: #000;
        }

        .video-frame {
            width: 80%;
            max-width: 1100px;
            height: auto;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
        }

        .video-frame>video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Carousel */
        .carousel-frame {
            position: relative;
            width: 100%;
            max-width: 83%;
            margin: 40px auto;
            background: transparent;
            border: none;
            padding: 0;
            /* 不在这里加 padding */
        }

        .carousel-frame {
            position: relative;
            width: 100%;
            max-width: 83%;
            margin: 0 auto;
            border: 1px solid #FE0070;
            border-radius: 1rem;
            overflow: hidden;
        }

        /* 新增：专门给绿色区域视频加的样式 */
        .carousel-frame.green-border {
            border: 1px solid #24C88B;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            font-size: 2rem;
            line-height: 1;
            /* 保证上下居中 */
            color: #ffffff;
            background: rgba(0, 0, 0, 0.9);
            border: none;
            border-radius: 50%;
            border: 1.5px solid #000000;
            cursor: pointer;
            z-index: 10;
        }

        .arrow.left {
            left: 15px;
            padding-bottom: 7px;
        }

        .arrow.right {
            right: 15px;
            padding-bottom: 7px;
            /* 微调，避免 › 看起来偏左 */
        }



        .carousel-frame video {

            width: 100%;
            aspect-ratio: 16/9;
            /* 或者和你 poster 一样的比例 */
            height: auto;
            display: block;
            border-radius: 1rem;
            background: #FCFBF4;
            object-fit: cover;
            /* 保证裁切一致 */

        }

        /* 让 section 控制留白 */
        .block.video-block {
            padding: 5vw 8vw 0 8vw;
            background-color: #F7FFFC;
            min-height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 清除视频区内的底部空白：去掉走马灯的下边距、video 的下边距 */
        .block.video-block .carousel-frame {
            margin: 0;
            padding: 0;
        }

        .block.video-block .carousel-frame video {
            display: block;
            margin: 0;
            padding: 0;
        }




        /* Carousel */
        .poster-carousel {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 8vw;
            margin: 0px auto;
            background-color: #FFF5F9;
        }



        .poster-carousel .carousel-frame {
            position: relative;
            width: 100%;
            max-width: 83%;
            overflow: hidden;
            border-radius: 1rem;
            background: transparent;
            margin: 0 auto;
        }

        .poster-carousel .carousel-frame::before {
            content: "";
            display: block;
            padding-top: 56.25%;
        }

        .poster-carousel .carousel-frame img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .poster-carousel .carousel-frame img.active {
            opacity: 1;
            z-index: 1;
        }

        .carousel-dots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .carousel-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffc4eb;
        }

        .carousel-dots .dot.active {
            background: #FE0070;
        }


        .poster-carousel.green-bg {
            background-color: #F7FFFC;
            /* 或者你想要的任何颜色 */
        }

        /* 为第二个走马灯的圆点设置新的颜色 */
        .poster-carousel.green-bg .carousel-dots .dot {
            background: #c4e5d9;
            /* 例如，灰色圆点 */
        }

        /* 为第二个走马灯的激活圆点设置新的颜色 */
        .poster-carousel.green-bg .carousel-dots .dot.active {
            background: #24C88B;
            /* 例如，白色激活圆点 */
        }

        /* 为第二个走马灯的边框设置新颜色 */
        .poster-carousel.green-bg .carousel-frame {
            border: 1px solid #24C88B;
            /* 举例，亮绿色 */
        }




        .poster-carousel.blue-bg {
            background-color: #F1F8FF;
            /* 或者你想要的任何颜色 */
        }

        /* 为第二个走马灯的圆点设置新的颜色 */
        .poster-carousel.blue-bg .carousel-dots .dot {
            background: #bedbf1;
            /* 例如，灰色圆点 */
        }

        /* 为第二个走马灯的激活圆点设置新的颜色 */
        .poster-carousel.blue-bg .carousel-dots .dot.active {
            background: #4464F6;
            /* 例如，白色激活圆点 */
        }

        /* 为第二个走马灯的边框设置新颜色 */
        .poster-carousel.blue-bg .carousel-frame {
            border: 1px solid #4464F6;
            /* 举例，亮绿色 */
        }



        .poster-carousel.yellow-bg {
            background-color: #fff;
        }

        /* 为第二个走马灯的圆点设置新的颜色 */
        .poster-carousel.yellow-bg .carousel-dots .dot {
            background: #c5c5c5;
            /* 例如，灰色圆点 */
        }

        /* 为第二个走马灯的激活圆点设置新的颜色 */
        .poster-carousel.yellow-bg .carousel-dots .dot.active {
            background: #000000;
            /* 例如，白色激活圆点 */
        }

        /* 为第二个走马灯的边框设置新颜色 */
        .poster-carousel.yellow-bg .carousel-frame {
            border: 1px solid #666;
            /* 举例，亮绿色 */
        }







        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 4vw;
            font-size: 0.8rem;
            border-top: 0.8px solid #666;
        }

        footer span {
            color: #666;
            font-weight: 300;
        }

        .more-wrapper {
            display: inline-block;
            text-decoration: none;
        }

        .more-text {
            position: relative;
            width: 135px;
            height: 38px;
            border: 1px solid #666;
            border-radius: 999px;
            overflow: hidden;
            perspective: 600px;
            display: inline-block;
            cursor: none;
        }

        .more-text .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: #000000;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.22, 1.61, 0.36, 1);
        }

        .more-text .top {
            transform: rotateX(90deg) translateY(-100%);
            transform-origin: top;
        }

        .more-wrapper:hover .more-text .front {
            transform: rotateX(-90deg) translateY(100%);
            transform-origin: bottom;
        }

        .more-wrapper:hover .more-text .top {
            transform: rotateX(0deg);
            font-weight: 500;
        }

        .divider {
            display: none;
        }



        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

                gap: 1rem;
                flex-wrap: wrap;
            }



            .back-button img {
                width: 30px;

            }

            .project-title {

            }

            .project-meta {
                padding-top: 30px;

                line-height: 1.5;
                color: #000000;
            }

            .title-group {
                display: flex;
                flex-direction: column;
            }

            .chinese-title {
                height: 140px;
            }


            .grid-container {
                grid-template-columns: 1fr;
            }

            .grid-item {

                padding: 8vw;
            }

            .center {

                padding-top: 30px;
                padding-bottom: 80px;
            }

            .logo-button {
                top: 8vw;
                left: 8vw;
                width: 45px;
                height: 45px;
                border-radius: 50%;
                border: 1px solid #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                flex-shrink: 0;
            }

            .logo-bottom {
                display: flex;
                flex-direction: row;
                /* ✅ 关键：横向排列 */
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                flex-wrap: wrap;
            }



            .logo-button img {
                width: 30px;
                height: 30px;
            }


            footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 8vw;
                font-size: 0.8rem;
                /* border-top: 1px solid #ccc; */
            }


            footer span {
                font-size: 0.75rem;
                color: #000000;

            }


            .more-wrapper {
                display: inline-block;
                text-decoration: none;
            }




            .more-text {
                width: 110px;
                height: 30px;
                border: 0.8px solid #ffffff;
            }



            .more-text .face {
                font-size: 0.75rem;
                font-weight: 200;
            }

            .poster-carousel .carousel-frame {

                border-radius: 10px;

            }

            .carousel-dots {
                display: none;
            }


            .carousel-frame video {


                border-radius: 10px;


            }




        }
    </style>
</head>
