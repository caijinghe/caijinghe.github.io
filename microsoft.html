            border-radius: 24px;
            padding: 48px 48px;
            box-sizing: border-box;

        .confidential-lock-badge {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }

        .animated-lock {
            width: 48px;
            height: 52px;
            overflow: visible;
            display: block;
        }

        /* Shackle base */
        .animated-lock .lock-shackle {
            transform-box: view-box;
            transform-origin: 21px 22px;
        }

        /* Unlocked: open on the left at y = -5px */
        .animated-lock.is-unlocked .lock-shackle {
            transform: translateY(-5px) scaleX(-1);
            transition: transform 0.4s ease-out;
        }

        /* Locked: 2-stage lock animation: slide horizontal first at -5px (no height change), THEN snap down into body! */
        .animated-lock.is-locked .lock-shackle {
            transform: translateY(3.5px) scaleX(1);
            animation: shackleLockSequence 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes shackleLockSequence {
            0% {
                /* Left side, elevated at -5px */
                transform: translateY(-5px) scaleX(-1);
            }
            55% {
                /* Swung across to the right, HEIGHT UNCHANGED at -5px! */
                transform: translateY(-5px) scaleX(1);
            }
            75% {
                /* Snaps down deep into the lock body! */
                transform: translateY(4.5px) scaleX(1);
            }
            100% {
                /* Settles snugly in locked position */
                transform: translateY(3.5px) scaleX(1);
            }
        }

        /* Lock body recoil when shackle snaps down */
        .animated-lock .lock-body {
            transform-box: view-box;
            transform-origin: 30px 48px;
        }
        .animated-lock.is-locked .lock-body {
            animation: lockBodyRecoil 0.65s ease forwards;
        }
        @keyframes lockBodyRecoil {
            0%, 55% {
                transform: scale(1, 1);
            }
            68% {
                transform: scale(1.06, 0.93);
            }
            84% {
                transform: scale(0.98, 1.02);
            }
            100% {
                transform: scale(1, 1);
            }
        }

        /* Eyes shut tightly on impact, then open back up */
        .animated-lock .lock-eye-wrap {
            transform-box: view-box;
            transform-origin: 30px 41px;
        }
        .animated-lock.is-locked .lock-eye-wrap {
            animation: eyeShutAndOpen 0.95s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes eyeShutAndOpen {
            0%, 45% {
                transform: scaleY(1);
            }
            58% {
                transform: scaleY(0.06); /* Squeeze shut on impact */
            }
            78% {
                transform: scaleY(0.06); /* Stay shut during the jolt */
            }
            90% {
                transform: scaleY(1.1);  /* Pop open with lively bounce */
            }
            100% {
                transform: scaleY(1);    /* Settle wide open */
            }
        }

        /* Pupils: Look left, look right once, then drop down slightly below center */
        .animated-lock .pupil {
            transition: transform 0.3s ease;
        }
        .animated-lock.is-unlocked .pupil {
            /* Open state: slightly lower and glance towards open shackle */
            transform: translate(-1.0px, 0.8px);
        }
        .animated-lock.is-locked .pupil {
            /* Plays ONCE: look left, look right, then settle slightly below center */
            animation: pupilLookAroundOnce 2.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes pupilLookAroundOnce {
            0%, 28% {
                /* Centered while eyes shut and open */
                transform: translate(0, 0.4px);
            }
            38%, 52% {
                /* Look left */
                transform: translate(-1.8px, 0.2px);
            }
            62%, 76% {
                /* Look right */
                transform: translate(1.8px, 0.2px);
            }
            88%, 100% {
                /* Settle into resting position: slightly below center, not dead center */
                transform: translate(0, 1.4px);
            }
        }

    <script>



        // 密码保护逻辑（已保留UI与逻辑，如需重新启用密码保护设为 true 即可）
        const PASSWORD_PROTECT_ENABLED = false;
        if (PASSWORD_PROTECT_ENABLED) {
            protectPage({
                storageKey: "microsoft-project-unlocked",
                mount: "#samsung-stack",
                payload: "#microsoft-payload"
            });
            document.body.style.overflow = "hidden";
        } else {
            document.body.style.overflow = "auto";
        }

        // 加载动画逻辑 - 页面加载完毕后才移除
        const overlay = document.getElementById("loading-overlay");
        const loadingVideo = document.getElementById("loading-video");
        const loadStart = Date.now();

        if (loadingVideo) {
            loadingVideo.play().catch(() => {});
        }

        function removeOverlay() {
            if (overlay) {
                overlay.style.transition = "opacity 0.6s ease";
                overlay.style.opacity = "0";
                overlay.style.pointerEvents = "none";
                setTimeout(() => {
                    if (overlay.parentNode) overlay.remove();
                }, 600);
            }
        }

        // Scroll-driven Lock Controller (snaps shut when approaching the bottom)
        function initAnimatedLock() {
            const lockSvg = document.getElementById('microsoft-lock-svg');
            const card = document.querySelector('.confidential-card');
            const lockBadge = document.getElementById('confidential-lock-badge');
            if (!lockSvg || !card) return;

            let isLocked = false;

            function updateLockState() {
                const rect = card.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                // 快要滑到底部时（卡片顶部进入下半视口75%位置，或页面距离最底160px以内）扣上
                const isNearBottom = (windowHeight + window.scrollY) >= (document.documentElement.scrollHeight - 160);
                const isCardEntering = rect.top < (windowHeight * 0.75) && rect.bottom > 0;

                if (isNearBottom || isCardEntering) {
                    if (!isLocked) {
                        isLocked = true;
                        lockSvg.classList.remove('is-unlocked');
                        lockSvg.classList.add('is-locked');
                    }
                } else {
                    if (isLocked) {
                        isLocked = false;
                        lockSvg.classList.remove('is-locked');
                        lockSvg.classList.add('is-unlocked');
                    }
                }
            }

            // 监听滚动
            window.addEventListener('scroll', updateLockState, { passive: true });
            // 初次检测状态
            updateLockState();

            // 点击锁也可交互切换
            if (lockBadge) {
                lockBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    isLocked = !isLocked;
                    if (isLocked) {
                        lockSvg.classList.remove('is-unlocked');
                        lockSvg.classList.add('is-locked');
                    } else {
                        lockSvg.classList.remove('is-locked');
                        lockSvg.classList.add('is-unlocked');
                    }
                });
            }
        }
        initAnimatedLock();

        window.addEventListener("load", () => {
            const elapsed = Date.now() - loadStart;
            setTimeout(removeOverlay, Math.max(0, 800 - elapsed));
        });

        if (window.parent !== window && new URLSearchParams(location.search).has('preview')) {
            document.body.style.overflow = "auto";
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    parent.postMessage({ type: 'microsoft-close' }, location.origin);
                }
            });
            document.querySelectorAll('a').forEach(link => {
                if (link.hostname !== location.hostname) link.target = '_blank';
                else link.target = '_top';
            });
        }
    </script>
