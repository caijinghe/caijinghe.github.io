<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nestify — Jinghe Cai</title>
    <link rel="icon" href="media/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/workheader2.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .coming-soon-container {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px;
            user-select: none;
        }
        .coming-soon-title {
            font-size: clamp(16px, 2vw, 19px);
            font-weight: 300;
            line-height: 1.4;
        }
        .coming-soon-dots { display: inline-flex; margin-left: 2px; letter-spacing: 0.08em; }
        .coming-soon-dots span { animation: dotWave 1.4s infinite ease-in-out; opacity: 0.18; }
        .coming-soon-dots span:nth-child(2) { animation-delay: 0.22s; }
        .coming-soon-dots span:nth-child(3) { animation-delay: 0.44s; }
        @keyframes dotWave {
            0%, 100% { opacity: 0.18; transform: translateY(0); }
            35% { opacity: 1; transform: translateY(-2px); }
            70% { opacity: 0.25; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-col-1"><a href="index.html" class="my-name">Jinghe Cai</a></div>
        <nav class="header-col-2"><a href="index.html#work">Work</a></nav>
        <div class="header-col-3">
            <a href="about.html">Info</a>
            <a href="https://drive.google.com/file/d/1IsOUI2ZcsX_7XXkCw_bYc1aIiybE1FQT/view?usp=sharing" target="_blank">Résumé</a>
        </div>
    </header>
    <main class="coming-soon-container">
        <h1 class="coming-soon-title">Coming soon<span class="coming-soon-dots" aria-label="..."><span>.</span><span>.</span><span>.</span></span></h1>
    </main>
</body>
</html>
