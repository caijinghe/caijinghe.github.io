    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            color: #111;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }


        .content {
            flex: 1;
            display: flex;
            /* height: 100vh; */
            align-items: stretch;
            overflow: hidden;
        }



        .left-panel {
            flex: 1;
            padding: 4vw 0 20vw 6vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;

        }




        .info-award-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 2vw;
            /* ❌ 不需要 margin-top 或 margin-bottom */
        }



        .project-info h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-top: 10rem;
        }

        .project-info p {
            font-size: 1rem;
            font-weight: 200;
            margin-top: 30px;
            line-height: 1.6;
        }

        .award {
            width: 16vh;
        }

        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vw;
            padding-left: 0;
        }

        .carousel-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .carousel {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: none;
            border-radius: 15px;
        }

        .carousel img.active {
            display: block;
        }





        .dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cecece;
            /* border: 1px solid #000; */
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: #000;
        }


    @media (max-width: 1000px) {
            html {
                height: auto !important;
                overflow-x: hidden;
            }

            html,
            body {
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
            }

            .content {
                flex-direction: column;
                height: auto !important;
            }

            .left-panel {
                padding: 10vw 8vw 0 8vw;
            }

            .info-award-wrapper {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 1vw;
                margin-top: 15vh;
            }

            .project-info h1 {
                font-size: 1.8rem;
                font-weight: 300;
                margin-top: 0;
            }

            .project-info p {
                font-size: 0.8rem;
                font-weight: 200;
                margin-top: 1rem;
                line-height: 1.5;
            }

            .award {
                width: 80px;
                margin-top: 10px;
            }





            .right-panel {

                margin-top: 10vw;
                padding: 8vw;
            }

            .carousel-wrapper {
                height: auto;
                aspect-ratio: 1 / 1.2;
            }

            .carousel img {
                max-height: 100%;
                height: auto;
                width: auto;
            }


            .dots {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-top: 3vh;
            }

            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: #cecece;;
                cursor: none;
                transition: background-color 0.3s;
            }

            .dot.active {
                background-color: #000;
            }



        }
    </style>
</head>

<body>


    <header class="project-hero">

        <div class="site-header">
            <div class="header-col-1">
                <a href="index.html" class="my-name">Jinghe Cai</a>
            </div>
            <nav class="header-col-2">

            <a href="index.html#visual">Visual</a>
            <a href="https://scholar.google.com/citations?user=USR_nP8AAAAJ&hl=en" target="_blank">Research</a> -->
            </nav>
            <nav class="header-col-3">
                <a href="about.html">Info</a>
                <a href="https://drive.google.com/file/d/1IsOUI2ZcsX_7XXkCw_bYc1aIiybE1FQT/view?usp=sharing"
                    target="_blank">Résumé</a>
            </nav>
        </div>


        <div class="content">
            <div class="left-panel">
                <!-- <a href="work.html" class="logo-button">
                <img src="media/logo.svg" alt="Back" /> -->
                </a>
                <div class="info-award-wrapper">
                    <div class="project-info">
                        <img src="media/bibf/bibf.png" alt="Award" class="award" />
                        <p>Beijing International Book Fair<br /> <br />Key Visual Design<br />Sep 2020, Client Work</p>
                    </div>

                </div>
            </div>


            <div class="right-panel">
                <div class="carousel-wrapper">
                    <div class="carousel">
                        <img src="media/bibf/bibf1.jpg" class="carousel-image active" />
                        <img src="media/bibf/bibf2.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf3.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf4.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf5.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf6.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf7.jpg" class="carousel-image" />
                        <img src="media/bibf/bibf8.jpg" class="carousel-image" />
                    </div>
                </div>
                <div class="dots"></div>
            </div>
        </div>



        <script>
            const images = document.querySelectorAll('.carousel-image');
            const dotsContainer = document.querySelector('.dots');
            let current = 0;
            let interval;

            function showImage(index) {
                images.forEach((img, i) => {
                    img.classList.toggle('active', i === index);
                });
                document.querySelectorAll('.dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
                current = index;
            }

            function createDots() {
                images.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    if (i === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => {
                        showImage(i);
                        resetInterval();
                    });
                    dotsContainer.appendChild(dot);
                });
            }

            function nextImage() {
                showImage((current + 1) % images.length);
            }

            function startInterval() {
                interval = setInterval(nextImage, 4000);
            }

            function resetInterval() {
                clearInterval(interval);
                startInterval();
            }

            createDots();
            startInterval();
        </script>
</body>
