
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naivevil</title>
    <!-- Favicon -->
    <link rel="icon" href="media/logo.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    
    <link rel="stylesheet" href="css/index.css?v=20260920-16" />
    <link rel="stylesheet" href="css/scroll-indicator.css?v=20260920-1" />
    <script src="js/scroll-indicator.js?v=20260920-1" defer></script>
    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            document.documentElement.classList.add('is-preview');
        }
    </script>
  


    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Inter, sans-serif;
            /* background-color: #FFFCF2; */
            background-color: #ffffff;
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            cursor: default;
        }

        html.is-preview,
        body.is-preview {
            overflow-y: auto;
            overflow-x: hidden;
            height: auto !important;
            min-height: 100%;
        }

        html.is-preview body {
            display: block;
        }

        header {
            padding: 20vw 4vw 4vw 4vw;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6rem;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .project-hero {
            padding: 4vw 4vw 80px 4vw;
        }

        html.is-preview .project-hero,
        body.is-preview .project-hero {
            padding-top: 168px;
            padding-bottom: 96px;
            padding-left: 5vw;
            padding-right: 5vw;
        }

        @media (max-width: 600px) {
            .project-hero {
                padding-bottom: 60px;
            }

            html.is-preview .project-hero,
            body.is-preview .project-hero {
                padding-top: 116px;
                padding-bottom: 72px;
                padding-left: 6vw;
                padding-right: 6vw;
            }
        }

        .project-hero .header-bottom {
            margin-top: 0;
            justify-content: center;
        }

        .back-button {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 1px solid #6e6e6e;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
        }


        .back-button img {
            width: 36px;
            height: 36px;
        }

        .project-title {
            /* font-family: 'Sora', sans-serif; */
            font-size: 3rem;
            font-weight: 300;
        }

        .project-meta {
            margin-top: 24px;
            padding-top: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .project-meta__description {
            font-family: 'Inter', sans-serif;
            font-size: clamp(12px, 1.3vw, 14px);
            line-height: 1.5;
            color: #222;
            margin: 0;
            font-weight: 400;
            text-align: center;
        }

        .project-meta__details {
            font-family: 'Inter', sans-serif;
            font-size: clamp(11px, 1.1vw, 12px);
            line-height: 1.5;
            color: #999;
            margin: 3px 0 0;
            font-weight: 400;
            text-align: center;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .chinese-title {
            height: clamp(160px, 20vw, 220px);
            width: auto;
            display: block;
            margin: 0 auto;
        }

.grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 0;
            
            /* ✅ 修改开始：使用 gap 来制作分割线 */
            background-color: #d8d8d8; /* 这里定义线条的颜色 */
            gap: 1px;               /* 这里定义线条的粗细 */
            border: 1px solid #d8d8d8; /* 这里定义最外圈的边框 */
            
            /* ❌ 删除旧的边框写法 */
            /* border-top: 1px solid #ccc; */
            /* border-left: 1px solid #ccc; */
        }

.grid-item {
            aspect-ratio: 1 / 1;
            
            /* ❌ 删除旧的边框写法 */
            /* border-right: 1px solid #ccc; */
            /* border-bottom: 1px solid #ccc; */

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vw;
            
            /* ✅ 修改开始：遮盖底色 */
            /* 卡片背景统一为纯白 */
            /* 这样才能盖住 container 的灰色背景，只漏出 gap 的缝隙作为线条 */
            background-color: #ffffff; 
            
            box-sizing: border-box;
            cursor: default;
        }
        

        .grid-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 9999;

            /* ✅ 加入柔和阴影 */
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.25) inset, 0 0 60px rgba(0, 0, 0, 0.3);
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
        }

        .lightbox.active {
            display: flex;
        }


        footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4vw;
            font-size: 0.8rem;
            /* border-top: 1px solid #ccc; */
        }

        footer span {
            color: #909090;
            font-weight: 400;
        }


        .more-wrapper {
            display: inline-block;
            text-decoration: none;
        }




        .more-text {
            position: relative;
            width: 135px;
            height: 38px;
            border: 1px solid #6e6e6e;
            border-radius: 999px;
            overflow: hidden;
            /* ✅ 关键：限制内部 face 的翻转范围 */
            perspective: 600px;
            display: inline-block;
            cursor: default;
        }



        .more-text .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 300;

            color: #000;

            line-height: 1;
            /* ✅ 去掉额外空隙 */
            padding: 0;
            /* ✅ 显式移除 padding */
            margin: 0;

            backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.22, 1.61, 0.36, 1);
        }

        .more-text .top {
            transform: rotateX(90deg) translateY(-100%);
            transform-origin: top;
        }

        .more-wrapper:hover .more-text .front {
            transform: rotateX(-90deg) translateY(100%);
            transform-origin: bottom;
        }

        .more-wrapper:hover .more-text .top {
            transform: rotateX(0deg);
            font-weight: 500;
        }


        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            header {
                gap: 1.5rem;
            }

            header {
                padding: 8vw 8vw 4vw 8vw;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 6rem;
            }

            .header-top {
                display: flex;
                align-items: center;
                gap: rem;
            }



    

            .header-bottom {
                display: flex;
                flex-direction: row;
                /* ✅ 关键：横向排列 */
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                flex-wrap: wrap;
                margin-top: 30vh;
            }



            .back-button img {
                width: 30px;
                height: 30px;
            }

            .project-title {
                /* font-family: 'Sora', sans-serif; */
                font-size: 1.8rem;
                font-weight: 300;
            }

            .project-meta {
                margin-top: 20px;
                padding-top: 0;
                text-align: center;
            }

            .title-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .chinese-title {
                height: 140px;
                width: auto;
                margin: 0 auto;
            }


            .grid-container {
                grid-template-columns: 1fr;
            }

            .grid-item {

                padding: 8vw;
            }


            footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 8vw;
                font-size: 0.8rem;
                /* border-top: 1px solid #ccc; */
            }


            footer span {
                font-size: 0.75rem;
                color: #909090;

            }


            .more-wrapper {
                display: inline-block;
                text-decoration: none;
            }




            .more-text {
                width: 110px;
                height: 30px;
                border: 0.8px solid #000000;
            }



            .more-text .face {
                font-size: 0.75rem;
                font-weight: 200;
            }





        }
    </style>
</head>

<body>
<header class="project-hero">
    
    <div class="header-bottom">
        <div class="title-group">
            <img src="media/naivevil/naive_name.svg" alt="天真有邪" class="chinese-title" />
            <div class="project-meta">
                <p class="project-meta__description">Chinese Ink Painting</p>
                <p class="project-meta__details">Jul 2019, Individual Work</p>
            </div>
        </div>
    </div>

</header>

    <div class="grid-container">
        <div class="grid-item"><img src="media/naivevil/naivevil1.jpg" alt="naivevil1" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil2.jpg" alt="naivevil2" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil3.jpg" alt="naivevil3" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil4.jpg" alt="naivevil4" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil5.jpg" alt="naivevil5" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil6.jpg" alt="naivevil6" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil7.jpg" alt="naivevil7" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil8.jpg" alt="naivevil8" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil9.jpg" alt="naivevil9" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil10.jpg" alt="naivevil10" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil11.jpg" alt="naivevil11" /></div>
        <div class="grid-item"><img src="media/naivevil/naivevil12.jpg" alt="naivevil12" /></div>
    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="Zoomed artwork">
    </div>

    <footer>
        <span>© 2025 Jinghe Cai. All rights reserved.</span>
        <!-- <a href="work.html" class="more-wrapper">
            <span class="more-text">
                <span class="face front">MORE WORKS</span>
                <span class="face top">MORE WORKS</span>
            </span>
        </a> -->
    </footer>

  


    <script>
        const gridItems = document.querySelectorAll('.grid-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        gridItems.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });



    </script>
    <script>
        if (window.parent !== window && new URLSearchParams(location.search).has('preview')) {
            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;
                const zoom = document.getElementById('lightbox');
                if (zoom.classList.contains('active')) zoom.classList.remove('active');
                else parent.postMessage({ type: 'naivevil-close' }, location.origin);
            });
            document.querySelectorAll('.site-header a').forEach(link => link.target = '_top');
        }
    </script>
</body>


</html>
