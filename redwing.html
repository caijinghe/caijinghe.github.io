    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #111;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* ✅ 确保整个页面不超出一屏 */
            overflow: hidden;
            /* ✅ 强制不显示滚动条（可选） */
        }

        .content {
            flex: 1;
            /* ✅ 让它自动占据剩余空间 */
            display: flex;
            align-items: stretch;
            overflow: hidden;
        }




        .left-panel {
            flex: 1;
            padding: 4vw 0 15vw 6vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;

        }

        .info-award-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            /* 左对齐 */
            margin-top: auto;
            /* ✅ 关键：让这个 block 自动顶到底部 */
        }




        .project-info h1 {
            font-size: 3rem;
            font-weight: 300;

        }

        .project-info p {
            font-size: 1rem;
            font-weight: 200;
            margin-top: 30px;
            line-height: 1.6;
            /* margin-bottom: 8vh; */
        }

        .award {
            margin-top: 4vh;
            width: 12vh;
        }

        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vw;
            padding-left: 0;
        }

        .carousel-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .carousel {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: none;

            /* ✅ 新增：添加圆角 */
            border-radius: 15px;
            /* 你可以调整这个数字，比如 8px, 15px, 20px 等 */
        }

        .carousel img.active {
            display: block;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cecece;
            /* border: 1px solid #000; */
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: #000;
        }

      

        @media (max-width: 1000px) {
            html {
                height: auto !important;
                overflow-x: hidden;
            }

            html,
            body {
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
            }

            .content {
                flex-direction: column;
                height: auto !important;
            }

            .left-panel {
                padding: 10vw 8vw 0 8vw;
            }

            .info-award-wrapper {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 1vw;
                margin-top: 15vh;
            }

            .project-info h1 {
                font-size: 1.8rem;
                font-weight: 300;
                margin-top: 0;
            }

            .project-info p {
                font-size: 0.8rem;
                font-weight: 200;
                margin-top: 1rem;
                line-height: 1.5;
            }

            .award {
                width: 80px;
                margin-top: 10px;
            }





            .right-panel {
                padding: 8vw;
            }

            .carousel-wrapper {
                height: auto;
                aspect-ratio: 1 / 1.2;
            }

            .carousel img {
                max-height: 100%;
                height: auto;
                width: auto;
            }


            .dots {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-top: 3vh;
            }

            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: #cecece;;
                cursor: none;
                transition: background-color 0.3s;
            }

            .dot.active {
                background-color: #000;
            }



        }
    </style>
</head>

<body>

    <div id="custom-cursor"></div>

    <script>
        const images = document.querySelectorAll('.carousel-image');
        const dotsContainer = document.querySelector('.dots');
        let current = 0;
        let interval;

        function showImage(index) {
            images.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            current = index;
        }

        function createDots() {
            images.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => {
                    showImage(i);
                    resetInterval();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function nextImage() {
            showImage((current + 1) % images.length);
        }

        function startInterval() {
            interval = setInterval(nextImage, 4000);
        }

        function resetInterval() {
            clearInterval(interval);
            startInterval();
        }

        createDots();
        startInterval();
    </script>
</body>
